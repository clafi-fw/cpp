# Releases an application when the version in its version.txt has no release yet: builds it for
# Windows and Linux, tags the commit <App>-v<version> and publishes both archives.
name: Release

on:
  push:
    branches: [main]
    paths:
      - "**/version.txt"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build every application and keep the archives on the run - no tag, no release"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.plan.outputs.apps }}
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: bash .github/release/plan.sh >> "$GITHUB_OUTPUT"

  linux:
    needs: plan
    if: needs.plan.outputs.apps != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .github/release
          file: .github/release/Containerfile
          tags: clafi-release
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build
        env:
          TARGETS: ${{ needs.plan.outputs.targets }}
        run: |
          mkdir -p "$RUNNER_TEMP/linux"
          read -ra targets <<< "$TARGETS"
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/src:ro" -v "$RUNNER_TEMP/linux:/work" \
            clafi-release bash /src/.github/release/build-linux.sh /src /work "${targets[@]}"
      - name: Package
        env:
          APPS: ${{ needs.plan.outputs.apps }}
        run: |
          bin="$RUNNER_TEMP/linux/bin"
          mkdir -p dist
          mapfile -t entries < <(jq -c '.[]' <<< "$APPS")
          for entry in "${entries[@]}"; do
            app=$(jq -r .app <<< "$entry")
            version=$(jq -r .version <<< "$entry")
            stage="$RUNNER_TEMP/stage/$app"
            mkdir -p "$stage"
            cp "$bin/$app" "$stage/"
            jq -r '.files[]' <<< "$entry" | while read -r file; do
              cp "$bin/$file" "$stage/"
            done
            cp .github/release/clafi-check.sh .github/release/Supported-Distros.md "$stage/"
            chmod 755 "$stage/$app" "$stage/clafi-check.sh"
            tar -czf "dist/$app-$version-linux-x86_64.tar.gz" -C "$RUNNER_TEMP/stage" "$app"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  windows:
    needs: plan
    if: needs.plan.outputs.apps != '[]'
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.apps) }}
    env:
      APP: ${{ matrix.app }}
      DIR: ${{ matrix.dir }}
      VERSION: ${{ matrix.version }}
      FILES: ${{ toJSON(matrix.files) }}
    steps:
      - uses: actions/checkout@v7
      - name: Build
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild `
            -find 'MSBuild\**\Bin\amd64\MSBuild.exe' | Select-Object -First 1
          & $msbuild "$env:DIR\$env:APP.vcxproj" -nologo -m `
            -p:Configuration=Release -p:Platform=x64 -p:ClaFiNoDiagnostic=true `
            "-p:OutDir=$env:RUNNER_TEMP\out\"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package
        shell: pwsh
        run: |
          $stage = "$env:RUNNER_TEMP\stage\$env:APP"
          New-Item -ItemType Directory -Force $stage, dist | Out-Null
          Copy-Item "$env:RUNNER_TEMP\out\$env:APP.exe" $stage
          foreach ($file in ($env:FILES | ConvertFrom-Json)) {
            Copy-Item "$env:RUNNER_TEMP\out\$file" $stage
          }
          Compress-Archive -Path $stage -DestinationPath "dist\$env:APP-$env:VERSION-windows-x64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.app }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [plan, linux, windows]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          APPS: ${{ needs.plan.outputs.apps }}
        run: |
          mapfile -t entries < <(jq -c '.[]' <<< "$APPS")
          for entry in "${entries[@]}"; do
            app=$(jq -r .app <<< "$entry")
            version=$(jq -r .version <<< "$entry")
            tag=$(jq -r .tag <<< "$entry")
            previous=$(git ls-remote --tags --refs origin "refs/tags/$app-v*" \
              | sed 's|.*refs/tags/||' | sort -V | tail -n 1)
            notes="$app $version for Windows 10 and 11 on x64, and for Linux under Wayland on x86-64.

          - **Windows** - unpack the zip and run $app.exe.
          - **Linux** - unpack the archive and run $app. It needs glibc 2.35 or newer, a Wayland session and a processor with AVX2 and FMA. Supported-Distros.md inside lists the desktops, and clafi-check.sh answers whether a machine can run it."
            case "$app" in
              WhatsClip) site="https://whatsclip.app" ;;
              *) site="" ;;
            esac
            if [ -n "$site" ]; then
              notes+="

          More about $app at $site."
            fi
            args=(--target "$GITHUB_SHA" --title "$app $version" --notes "$notes" --generate-notes)
            if [ -n "$previous" ]; then
              args+=(--notes-start-tag "$previous")
            fi
            gh release create "$tag" "${args[@]}" "dist/$app-$version-"*
          done
