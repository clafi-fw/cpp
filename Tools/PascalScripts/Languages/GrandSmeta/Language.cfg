@ClaFi 1.0
@encoding utf-8

; Format: https://clafi-fw.github.io/cpp/cfg.html
;
; What a GrandSmeta macro is to PascalScripts - the .gsps extension, the skeletons New starts
; from and the host's names for completion, read off help.grandsmeta.ru (Разработка макросов)
; and the macros shipped with the program. A copy in the settings folder stands over this one,
; whole. Class and enumeration names the shipped macros never spell are provisional: a variable
; declared with such a type completes its members only under the name used here.

Extension = .gsps

Information = Макрокоманды ГРАНД-Смета. База составлена 30.09.2026 по разделу «Разработка макросов»
    + " справки https://help.grandsmeta.ru/tekhnicheskij-razdel/programmirovanie-makrosov"
    + " и по макросам из состава программы ГРАНД-Смета версии 16.2."

Templates = [
    =[
        Name = Пустой
    ]
    =[
        Name = Макрос
        NewStem = Новый макрос
        Text = //#Description = Описание макроса
        | //#DocTypes    = Smeta
        | //#Category    = Мои макросы
        | //#ImageIndex  = 0
        |
        | "  procedure Run(Document: TDocument);"
        | "  begin"
        | "  end;"
        |
        | begin
        | end.
    ]
    =[
        Name = Макрос с настройками
        NewStem = Новый макрос
        Text = //#Description = Описание макроса
        | //#DocTypes    = Smeta
        | //#Category    = Мои макросы
        | //#ImageIndex  = 0
        |
        | var
        | "  cbEnabled: TCheckBox;"
        |
        | "  // Вызывается после инициализации и при каждом изменении настроек"
        | "  procedure OptionsChanged;"
        | "  begin"
        | "    EnableNextButton(cbEnabled.Checked);"
        | "  end;"
        |
        | "  // Вызывается для каждого обрабатываемого документа"
        | "  procedure Run(Document: TDocument);"
        | "  begin"
        | "    if cbEnabled.Checked then"
        | "      LogInfo('Обработка документа: ' + Document.Props.Description);"
        | "  end;"
        |
        | var
        | "  gr: TGroup;"
        | begin
        | "  gr := Options.AddGroup('Параметры обработки');"
        | "  cbEnabled := gr.AddCheckBox('Выполнить обработку');"
        | "  cbEnabled.Checked := True;"
        | end.
    ]
]

Completion = [
    =[
        Name = Options
        Kind = variable
        Signature = var Options: TGroup
