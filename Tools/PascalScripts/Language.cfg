@ClaFi 1.0
@encoding utf-8

; Format: https://clafi-fw.github.io/cpp/cfg.html
;
; What a script is to PascalScripts - its extension, the scripts New starts from and the names
; the host offers for completion. A copy in the settings folder stands over this one, whole.

Extension = .pas

Templates = [
    =[
        Name = Empty
    ]
    =[
        Name = Program
        NewStem = New Program
        Text = program NewProgram;
        |
        | begin
        | end.
    ]
    =[
        Name = Procedure
        NewStem = New Procedure
        Text = procedure Run;
        | begin
        | end;
        |
        | begin
        |     Run;
        | end.
    ]
]

Completion = [
    =[
        Name = Length
        Kind = function
        Signature = function Length(const S: string): Integer
        Type = Integer
        Hint = The number of characters in the string
    ]
    =[
        Name = Copy
        Kind = function
        Signature = function Copy(const S: string; Index, Count: Integer): string
        Type = string
        Hint = A part of the string, counted from one
    ]
    =[
        Name = Pos
        Kind = function
        Signature = function Pos(const Substr, S: string): Integer
        Type = Integer
        Hint = Where the substring first stands in the string, and zero where it does not
    ]
    =[
        Name = IntToStr
        Kind = function
        Signature = function IntToStr(Value: Integer): string
        Type = string
        Hint = The number spelled out
    ]
    =[
        Name = StrToInt
        Kind = function
        Signature = function StrToInt(const S: string): Integer
        Type = Integer
        Hint = The number the string spells
    ]
    =[
        Name = Trim
        Kind = function
        Signature = function Trim(const S: string): string
        Type = string
        Hint = The string without its leading and trailing blanks
    ]
    =[
        Name = UpperCase
        Kind = function
        Signature = function UpperCase(const S: string): string
        Type = string
        Hint = The string in capitals
    ]
    =[
        Name = Inc
        Kind = procedure
        Signature = procedure Inc(var X: Integer)
        Hint = Adds one
    ]
    =[
        Name = Dec
        Kind = procedure
        Signature = procedure Dec(var X: Integer)
        Hint = Takes one away
    ]
    =[
        Name = TObject
        Kind = class
        Hint = The root every class derives from
        Methods = [
            =[
                Name = Free
                Kind = procedure
                Signature = procedure Free
                Hint = Releases the object
            ]
            =[
                Name = ClassName
                Kind = function
                Signature = function ClassName: string
                Type = string
                Hint = The name of the object's class
            ]
        ]
    ]
    =[
        Name = TPersistent
        Kind = class
        Parent = TObject
        Hint = An object that can take on the value of another
        Methods = [
            =[
                Name = Assign
                Kind = procedure
                Signature = procedure Assign(Source: TPersistent)
                Hint = Copies the value of the source into this object
            ]
        ]
    ]
    =[
        Name = TStrings
        Kind = class
        Parent = TPersistent
        Hint = A list of strings - the base every string list derives from
        Methods = [
            =[
                Name = Add
                Kind = function
                Signature = function Add(const S: string): Integer
                Type = Integer
                Hint = Appends the string and answers its index
            ]
            =[
                Name = Clear
                Kind = procedure
                Signature = procedure Clear
                Hint = Empties the list
            ]
            =[
                Name = Delete
                Kind = procedure
                Signature = procedure Delete(Index: Integer)
                Hint = Removes the string at the index
            ]
            =[
                Name = IndexOf
                Kind = function
                Signature = function IndexOf(const S: string): Integer
                Type = Integer
                Hint = Where the string first stands, and -1 where it does not
            ]
            =[
                Name = Insert
                Kind = procedure
                Signature = procedure Insert(Index: Integer; const S: string)
                Hint = Puts the string in at the index
            ]
            =[
                Name = LoadFromFile
                Kind = procedure
                Signature = procedure LoadFromFile(const FileName: string)
                Hint = Replaces the list with the lines of the file
            ]
            =[
                Name = SaveToFile
                Kind = procedure
                Signature = procedure SaveToFile(const FileName: string)
                Hint = Writes the list to the file, a line per string
            ]
        ]
        Properties = [
            =[
                Name = Count
                Signature = property Count: Integer
                Type = Integer
                Hint = How many strings the list holds
            ]
            =[
                Name = Text
                Signature = property Text: string
                Type = string
                Hint = The whole list as one text, a line per string
            ]
            =[
                Name = Strings
                Signature = property Strings[Index: Integer]: string
                Type = string
                Hint = The string at the index, counted from zero
            ]
            =[
                Name = CommaText
                Signature = property CommaText: string
                Type = string
                Hint = The whole list as one line, the strings separated by commas
            ]
        ]
    ]
    =[
        Name = TStringList
        Kind = class
        Parent = TStrings
        Hint = A list of strings, one per line
        Methods = [
            =[
                Name = Sort
                Kind = procedure
                Signature = procedure Sort
                Hint = Puts the strings in order
            ]
            =[
                Name = Find
                Kind = function
                Signature = function Find(const S: string; var Index: Integer): Boolean
                Type = Boolean
                Hint = Whether a sorted list holds the string, and where it stands or would stand
            ]
        ]
        Properties = [
            =[
                Name = Sorted
                Signature = property Sorted: Boolean
                Type = Boolean
                Hint = Whether the list keeps its strings in order
            ]
            =[
                Name = CaseSensitive
                Signature = property CaseSensitive: Boolean
                Type = Boolean
                Hint = Whether finding and sorting tell capitals from small letters
            ]
        ]
    ]
    =[
        Name = TRGBColor
        Kind = class
        Parent = TPersistent
        Hint = A colour as its red, green and blue parts
        Properties = [
            =[
                Name = Red
                Signature = property Red: Byte
                Type = Byte
                Hint = The red part, 0 to 255
            ]
            =[
                Name = Green
                Signature = property Green: Byte
                Type = Byte
                Hint = The green part, 0 to 255
            ]
            =[
                Name = Blue
                Signature = property Blue: Byte
                Type = Byte
                Hint = The blue part, 0 to 255
            ]
        ]
    ]
    =[
        Name = TFont
        Kind = class
        Parent = TPersistent
        Hint = The typeface text is drawn in, with its size and colour
        Properties = [
            =[
                Name = Name
                Signature = property Name: string
                Type = string
                Hint = The typeface's family name
            ]
            =[
                Name = Size
                Signature = property Size: Integer
                Type = Integer
                Hint = The size in points
            ]
            =[
                Name = Color
                Signature = property Color: TRGBColor
                Type = TRGBColor
                Hint = The colour the text is drawn in
            ]
        ]
    ]
    =[
        Name = TComponent
        Kind = class
        Parent = TPersistent
        Hint = An object with a name, owned by another that releases it
        Properties = [
            =[
                Name = Name
                Signature = property Name: string
                Type = string
                Hint = The name the component is known by
            ]
            =[
                Name = Owner
                Signature = property Owner: TComponent
                Type = TComponent
                Hint = The component that releases this one
            ]
            =[
                Name = Tag
                Signature = property Tag: Integer
                Type = Integer
                Hint = A number kept for the script's own use
            ]
        ]
    ]
    =[
        Name = TControl
        Kind = class
        Parent = TComponent
        Hint = Something shown on a form
        Methods = [
            =[
                Name = Show
                Kind = procedure
                Signature = procedure Show
                Hint = Makes the control visible
            ]
            =[
                Name = Hide
                Kind = procedure
                Signature = procedure Hide
                Hint = Makes the control invisible
            ]
            =[
                Name = SetBounds
                Kind = procedure
                Signature = procedure SetBounds(ALeft, ATop, AWidth, AHeight: Integer)
                Hint = Moves and sizes the control in one step
            ]
        ]
        Properties = [
            =[
                Name = Left
                Signature = property Left: Integer
                Type = Integer
                Hint = Where the control's left edge stands in its parent
            ]
            =[
                Name = Top
                Signature = property Top: Integer
                Type = Integer
                Hint = Where the control's top edge stands in its parent
            ]
            =[
                Name = Width
                Signature = property Width: Integer
                Type = Integer
                Hint = How wide the control is
            ]
            =[
                Name = Height
                Signature = property Height: Integer
                Type = Integer
                Hint = How tall the control is
            ]
            =[
                Name = Visible
                Signature = property Visible: Boolean
                Type = Boolean
                Hint = Whether the control is shown
            ]
            =[
                Name = Hint
                Signature = property Hint: string
                Type = string
                Hint = The text shown while the pointer rests on the control
            ]
            =[
                Name = Font
                Signature = property Font: TFont
                Type = TFont
                Hint = The typeface the control's text is drawn in
            ]
            =[
                Name = Parent
                Signature = property Parent: TWinControl
                Type = TWinControl
                Hint = The control this one stands in
            ]
        ]
    ]
    =[
        Name = TWinControl
        Kind = class
        Parent = TControl
        Hint = A control that holds other controls and can take the focus
        Methods = [
            =[
                Name = SetFocus
                Kind = procedure
                Signature = procedure SetFocus
                Hint = Moves the keyboard focus to the control
            ]
            =[
                Name = CanFocus
                Kind = function
                Signature = function CanFocus: Boolean
                Type = Boolean
                Hint = Whether the control can take the focus now
            ]
        ]
        Properties = [
            =[
                Name = ControlCount
                Signature = property ControlCount: Integer
                Type = Integer
                Hint = How many controls stand in this one
            ]
            =[
                Name = Controls
                Signature = property Controls[Index: Integer]: TControl
                Type = TControl
                Hint = The control at the index, counted from zero
            ]
        ]
    ]
    =[
        Name = TMemo
        Kind = class
        Parent = TWinControl
        Hint = A box of several lines of text
        Methods = [
            =[
                Name = Clear
                Kind = procedure
                Signature = procedure Clear
                Hint = Empties the box
            ]
            =[
                Name = SelectAll
                Kind = procedure
                Signature = procedure SelectAll
                Hint = Selects the whole text
            ]
        ]
        Properties = [
            =[
                Name = Lines
                Signature = property Lines: TStrings
                Type = TStrings
                Hint = The text as a list, a string per line
            ]
            =[
                Name = Text
                Signature = property Text: string
                Type = string
                Hint = The whole text
            ]
            =[
                Name = ReadOnly
                Signature = property ReadOnly: Boolean
                Type = Boolean
                Hint = Whether typing leaves the text as it is
            ]
            =[
                Name = SelText
                Signature = property SelText: string
                Type = string
                Hint = The selected text, and what is put in at the caret when none is
            ]
        ]
    ]
    =[
        Name = TForm
        Kind = class
        Parent = TWinControl
        Hint = A window of the application
        Methods = [
            =[
                Name = Close
                Kind = procedure
                Signature = procedure Close
                Hint = Closes the window
            ]
            =[
                Name = ShowModal
                Kind = function
                Signature = function ShowModal: Integer
                Type = Integer
                Hint = Shows the window and waits for it to close, answering how it was closed
            ]
        ]
        Properties = [
            =[
                Name = Caption
                Signature = property Caption: string
                Type = string
                Hint = The title the window shows
            ]
            =[
                Name = ActiveControl
                Signature = property ActiveControl: TWinControl
                Type = TWinControl
                Hint = The control holding the focus in the window
            ]
        ]
    ]
]
